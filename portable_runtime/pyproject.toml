[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seadrrma-joint-test"
version = "0.1.0"
description = "Portable SEA joint runtime for TRACE/SEADRRMA ONNX controllers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "onnxruntime>=1.16,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.12.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
