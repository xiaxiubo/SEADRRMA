name: CI

on:
  push:
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pytest ruff==0.12.0
      - run: python tools/validate_release.py
      - run: ruff check portable_runtime/src portable_runtime/scripts portable_runtime/tests
      - run: pytest -q portable_runtime/tests
        env:
          PYTHONPATH: portable_runtime/src
